# Версіонований конфіг експерименту (принцип III).
# Зміна spend_cap_lamports — окремим комітом із записом у changelog леджера.
# Жодних URL і ключів: rpc лише env:-посилання, keypair-и лише через volume ./keys.
config_version: "2026.10.23.2"
spend_cap_lamports: 50000000
base_fee_lamports: 5000
batch:
  tx_per_batch: 10
  cu_limit: 200000
  cu_price_lamports: 0
# Рівні рукавів (мікро-лампорти CU price / CU limit). Зміна рівнів змінює
# висновок — тому тут, під версією, а не в прапорцях.
arms:
  A_levels: [0, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 200000]
  B_price: 5000
  C_price: 5000
  C_limits: [50000, 100000, 200000, 400000, 800000, 1000000]
  D_levels: [0, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 200000]
validators:
  - identity: "TestValidator1111111111111111111111111111111111"
    label: "agave-1"
    expected_client: "agave"
  - identity: "TestValidator2222222222222222222222222222222222"
    label: "agave-2"
    expected_client: "agave"
  - identity: "TestValidator3333333333333333333333333333333333"
    label: "jito-1"
    expected_client: "jito-solana"
  - identity: "TestValidator4444444444444444444444444444444444"
    label: "jito-2"
    expected_client: "jito-solana"
  - identity: "TestValidator5555555555555555555555555555555555"
    label: "fd-1"
    expected_client: "frankendancer"
  - identity: "TestValidator6666666666666666666666666666666666"
    label: "fd-2"
    expected_client: "frankendancer"
rpc:
  http_url_ref: "env:RPC_URL"
  ws_url_ref: "env:WS_URL"
